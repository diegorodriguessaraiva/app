<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Agenda">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>Agenda Escolar</title>
<style>
  :root {
    --bg: #f2f2f7;
    --group: #ffffff;
    --elev: #ffffff;
    --label: #000000;
    --label2: rgba(60,60,67,.6);
    --label3: rgba(60,60,67,.3);
    --sep: rgba(60,60,67,.18);
    --fill: rgba(120,120,128,.12);
    --fill2: rgba(120,120,128,.2);
    --blue: #007aff;
    --red: #ff3b30;
    --orange: #ff9500;
    --green: #34c759;
    --purple: #af52de;
    --gray: #8e8e93;
    --nav-bg: rgba(249,249,249,.82);
    --sheet: #ffffff;
    --shadow: 0 12px 40px rgba(0,0,0,.16);
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-t: env(safe-area-inset-top, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000; --group: #1c1c1e; --elev: #2c2c2e; --label: #ffffff;
      --label2: rgba(235,235,245,.6); --label3: rgba(235,235,245,.3);
      --sep: rgba(84,84,88,.65); --fill: rgba(120,120,128,.24); --fill2: rgba(120,120,128,.32);
      --blue: #0a84ff; --red: #ff453a; --orange: #ff9f0a; --green: #30d158; --purple: #bf5af2;
      --nav-bg: rgba(22,22,24,.82); --sheet: #1c1c1e; --shadow: 0 12px 40px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="light"] {
    --bg:#f2f2f7;--group:#fff;--elev:#fff;--label:#000;--label2:rgba(60,60,67,.6);--label3:rgba(60,60,67,.3);
    --sep:rgba(60,60,67,.18);--fill:rgba(120,120,128,.12);--fill2:rgba(120,120,128,.2);
    --blue:#007aff;--red:#ff3b30;--orange:#ff9500;--green:#34c759;--purple:#af52de;
    --nav-bg:rgba(249,249,249,.82);--sheet:#fff;--shadow:0 12px 40px rgba(0,0,0,.16);
  }
  :root[data-theme="dark"] {
    --bg:#000;--group:#1c1c1e;--elev:#2c2c2e;--label:#fff;--label2:rgba(235,235,245,.6);--label3:rgba(235,235,245,.3);
    --sep:rgba(84,84,88,.65);--fill:rgba(120,120,128,.24);--fill2:rgba(120,120,128,.32);
    --blue:#0a84ff;--red:#ff453a;--orange:#ff9f0a;--green:#30d158;--purple:#bf5af2;
    --nav-bg:rgba(22,22,24,.82);--sheet:#1c1c1e;--shadow:0 12px 40px rgba(0,0,0,.5);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  @media (prefers-reduced-motion: reduce) { * { animation-duration: .001ms !important; transition-duration: .001ms !important; } }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg); color: var(--label);
    -webkit-font-smoothing: antialiased; overscroll-behavior-y: none;
  }
  button { font-family: inherit; cursor: pointer; }
  input, textarea, select { font-family: inherit; }
  ::selection { background: color-mix(in srgb, var(--blue) 30%, transparent); }

  .app { max-width: 640px; margin: 0 auto; min-height: 100%; position: relative; }

  /* ---- Nav / Large title ---- */
  .nav {
    position: sticky; top: 0; z-index: 30;
    background: var(--nav-bg); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px);
    padding-top: var(--safe-t); border-bottom: .5px solid var(--sep);
  }
  .nav-row { display: flex; align-items: flex-end; justify-content: space-between; padding: 6px 16px 4px; gap: 12px; }
  .nav-row h1 { font-size: 2.05rem; font-weight: 800; letter-spacing: .01em; line-height: 1.1; }
  .nav-sub { font-size: .82rem; color: var(--label2); font-weight: 600; margin: 2px 2px 0; padding: 0 16px; }
  .nav-actions { display: flex; gap: 6px; align-items: center; padding-bottom: 6px; }
  .icon-round {
    width: 34px; height: 34px; border-radius: 50%; border: none; background: var(--fill);
    color: var(--blue); font-size: 1.05rem; display: flex; align-items: center; justify-content: center;
    transition: transform .12s, background .15s;
  }
  .icon-round:active { transform: scale(.9); background: var(--fill2); }

  .searchbar { padding: 6px 16px 8px; }
  .searchbar .sb {
    display: flex; align-items: center; gap: 7px; background: var(--fill); border-radius: 10px;
    padding: 8px 10px; color: var(--label2);
  }
  .searchbar input {
    border: none; background: transparent; outline: none; color: var(--label); font-size: 1.02rem; flex: 1; min-width: 0;
  }
  .searchbar input::placeholder { color: var(--label2); }
  .sb .clear { display: none; border: none; background: var(--label3); color: var(--group); width: 18px; height: 18px; border-radius: 50%; font-size: .7rem; align-items: center; justify-content: center; }
  .sb.has-text .clear { display: flex; }

  .segs { display: flex; gap: 7px; overflow-x: auto; padding: 2px 16px 12px; scrollbar-width: none; }
  .segs::-webkit-scrollbar { display: none; }
  .seg {
    flex-shrink: 0; border: none; background: var(--fill); color: var(--label); font-size: .86rem; font-weight: 600;
    padding: 7px 14px; border-radius: 999px; transition: transform .12s, background .15s, color .15s; white-space: nowrap;
  }
  .seg:active { transform: scale(.94); }
  .seg.active { background: var(--blue); color: #fff; }
  .seg .badge-n { font-weight: 700; margin-left: 5px; opacity: .8; }

  /* ---- Content ---- */
  main { padding: 8px 16px 130px; }
  main[hidden] { display: none; }

  /* summary pills */
  .summary { display: flex; gap: 10px; overflow-x: auto; padding: 6px 0 12px; scrollbar-width: none; }
  .summary::-webkit-scrollbar { display: none; }
  .sumcard {
    flex-shrink: 0; min-width: 108px; background: var(--group); border-radius: 16px; padding: 12px 14px;
    box-shadow: 0 1px 2px rgba(0,0,0,.04); border: none; text-align: left; transition: transform .12s;
  }
  .sumcard:active { transform: scale(.96); }
  .sumcard .n { font-size: 1.7rem; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; }
  .sumcard .l { font-size: .76rem; color: var(--label2); font-weight: 600; margin-top: 5px; }
  .sumcard.red .n { color: var(--red); }
  .sumcard.orange .n { color: var(--orange); }
  .sumcard.blue .n { color: var(--blue); }
  .sumcard.purple .n { color: var(--purple); }

  /* sync row */
  .syncbar {
    display: flex; align-items: center; gap: 10px; background: var(--group); border-radius: 14px;
    padding: 11px 14px; margin-bottom: 16px; font-size: .9rem; box-shadow: 0 1px 2px rgba(0,0,0,.04);
  }
  .syncbar .spacer { flex: 1; }
  .sdot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .sdot.on { background: var(--green); } .sdot.off { background: var(--gray); }
  .sdot.err { background: var(--red); } .sdot.wait { background: var(--orange); animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
  .mini-btn { border: none; background: var(--blue); color: #fff; font-weight: 600; font-size: .82rem; padding: 7px 13px; border-radius: 9px; display: inline-flex; align-items: center; gap: 6px; }
  .mini-btn.ghost { background: var(--fill); color: var(--blue); }
  .mini-btn:active { opacity: .7; }
  .g-ic { width: 15px; height: 15px; }

  .day-sec { margin-bottom: 20px; }
  .day-title { font-size: .8rem; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; color: var(--label2); margin: 4px 4px 8px; }
  .day-title.today { color: var(--blue); }
  .day-title.late { color: var(--red); }

  .group { background: var(--group); border-radius: 16px; overflow: hidden; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
  .row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; position: relative; }
  .row + .row::before { content: ""; position: absolute; left: 48px; right: 0; top: 0; height: .5px; background: var(--sep); }
  .circle {
    flex-shrink: 0; width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--c, var(--gray));
    background: transparent; position: relative; transition: transform .15s; margin-top: 1px; align-self: flex-start;
  }
  .circle:active { transform: scale(.85); }
  .row.done .circle { background: var(--c, var(--gray)); }
  .row.done .circle::after { content: "✓"; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #fff; font-size: .8rem; font-weight: 800; }
  .row-main { flex: 1; min-width: 0; }
  .row-title { font-size: 1.02rem; font-weight: 500; line-height: 1.3; word-wrap: break-word; }
  .row.done .row-title { color: var(--label2); text-decoration: line-through; }
  .row-sub { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; align-items: center; font-size: .8rem; }
  .chip { display: inline-flex; align-items: center; gap: 4px; font-size: .74rem; font-weight: 600; padding: 2px 8px; border-radius: 6px; background: var(--fill); color: var(--label2); }
  .chip.type { color: #fff; }
  .chip.due-late { background: color-mix(in srgb, var(--red) 16%, transparent); color: var(--red); }
  .chip.due-today { background: color-mix(in srgb, var(--orange) 16%, transparent); color: var(--orange); }
  .chip.due-soon { background: color-mix(in srgb, var(--blue) 14%, transparent); color: var(--blue); }
  .chip.att { background: var(--fill); color: var(--label2); }
  .chev { color: var(--label3); font-size: 1.3rem; font-weight: 400; flex-shrink: 0; align-self: center; }

  .empty { text-align: center; padding: 60px 20px; color: var(--label2); }
  .empty .big { font-size: 3rem; margin-bottom: 10px; }
  .empty strong { display: block; color: var(--label); font-size: 1.05rem; margin-bottom: 4px; }
  .empty p { font-size: .9rem; }

  /* ---- Calendar ---- */
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin: 4px 2px 14px; }
  .cal-head .m { font-size: 1.3rem; font-weight: 800; text-transform: capitalize; }
  .cal-nav { display: flex; gap: 4px; align-items: center; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
  .cal-wd { text-align: center; font-size: .72rem; font-weight: 700; color: var(--label2); padding: 4px 0 8px; text-transform: uppercase; }
  .cal-cell {
    aspect-ratio: 1; border: none; background: transparent; border-radius: 50%; position: relative;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    font-size: .95rem; color: var(--label); font-variant-numeric: tabular-nums; transition: transform .1s;
  }
  .cal-cell:active { transform: scale(.9); }
  .cal-cell.other { color: var(--label3); }
  .cal-cell.today { color: var(--red); font-weight: 800; }
  .cal-cell.sel { background: var(--blue); color: #fff; font-weight: 700; }
  .cal-cell.sel.today { color: #fff; }
  .cal-dots { display: flex; gap: 2px; position: absolute; bottom: 6px; }
  .cal-dot { width: 5px; height: 5px; border-radius: 50%; }
  .cal-cell.sel .cal-dot { background: #fff !important; }
  .cal-daylist { margin-top: 20px; }
  .cal-daylist .day-title { font-size: .9rem; text-transform: none; color: var(--label); letter-spacing: 0; }

  /* ---- Tab bar ---- */
  .tabbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 35;
    background: var(--nav-bg); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-top: .5px solid var(--sep); display: flex; align-items: center; justify-content: space-around;
    padding: 8px 20px calc(8px + var(--safe-b)); max-width: 640px; margin: 0 auto;
  }
  .tab-btn { border: none; background: transparent; color: var(--label2); display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: .66rem; font-weight: 600; padding: 2px 16px; }
  .tab-btn .ic { font-size: 1.35rem; line-height: 1; }
  .tab-btn.active { color: var(--blue); }
  .add-fab {
    width: 54px; height: 54px; border-radius: 50%; border: none; background: var(--blue); color: #fff;
    font-size: 1.9rem; font-weight: 300; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 16px color-mix(in srgb, var(--blue) 45%, transparent); margin-top: -22px; transition: transform .12s;
  }
  .add-fab:active { transform: scale(.88); }

  /* ---- Sheet ---- */
  .backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.4); opacity: 0; pointer-events: none; transition: opacity .3s; z-index: 40; }
  .backdrop.show { opacity: 1; pointer-events: auto; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 45; background: var(--sheet);
    border-radius: 14px 14px 0 0; max-width: 640px; margin: 0 auto; max-height: 94vh; display: flex; flex-direction: column;
    transform: translateY(100%); transition: transform .34s cubic-bezier(.32,.72,0,1); box-shadow: var(--shadow);
    padding-bottom: var(--safe-b);
  }
  .sheet.open { transform: translateY(0); }
  .grabber-wrap { padding: 8px 0 2px; display: flex; justify-content: center; flex-shrink: 0; cursor: grab; touch-action: none; }
  .grabber { width: 36px; height: 5px; border-radius: 3px; background: var(--label3); }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 4px 16px 10px; flex-shrink: 0; }
  .sheet-head h2 { font-size: 1.1rem; font-weight: 700; }
  .sheet-head .cancel { border: none; background: transparent; color: var(--blue); font-size: 1.02rem; }
  .sheet-head .save { border: none; background: transparent; color: var(--blue); font-size: 1.02rem; font-weight: 700; }
  .sheet-head .save:disabled { color: var(--label3); }
  .sheet-body { overflow-y: auto; padding: 4px 16px 24px; -webkit-overflow-scrolling: touch; }

  .field { margin-bottom: 16px; }
  .field > label { display: block; font-size: .78rem; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; color: var(--label2); margin: 0 4px 7px; }
  .inp {
    width: 100%; padding: 12px 14px; border: none; background: var(--fill); border-radius: 11px; color: var(--label);
    font-size: 1.02rem; outline: none; -webkit-appearance: none; appearance: none;
  }
  textarea.inp { resize: none; min-height: 76px; line-height: 1.45; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .type-pick { display: flex; gap: 8px; flex-wrap: wrap; }
  .type-opt {
    border: none; background: var(--fill); color: var(--label); border-radius: 11px; padding: 10px 12px; font-size: .9rem;
    font-weight: 600; display: inline-flex; align-items: center; gap: 6px; transition: transform .12s;
  }
  .type-opt:active { transform: scale(.94); }
  .type-opt.sel { color: #fff; }

  /* attachments */
  .att-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 10px; }
  .att-add {
    aspect-ratio: 1; border: 2px dashed var(--label3); border-radius: 12px; background: var(--fill);
    color: var(--blue); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    font-size: .72rem; font-weight: 600;
  }
  .att-add .plus { font-size: 1.5rem; line-height: 1; }
  .att-item { position: relative; aspect-ratio: 1; border-radius: 12px; overflow: hidden; background: var(--fill); border: none; padding: 0; display: block; }
  .att-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .att-item .pdf { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: var(--red); }
  .att-item .pdf .ic { font-size: 1.6rem; }
  .att-item .pdf .nm { font-size: .6rem; color: var(--label2); padding: 0 4px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .att-item.missing { opacity: .55; }
  .att-item .rm { position: absolute; top: 4px; right: 4px; width: 20px; height: 20px; border-radius: 50%; border: none; background: rgba(0,0,0,.6); color: #fff; font-size: .7rem; display: flex; align-items: center; justify-content: center; }
  .att-hint { font-size: .76rem; color: var(--label2); margin: 8px 4px 0; }

  .delete-btn { width: 100%; padding: 13px; border: none; background: var(--group); color: var(--red); border-radius: 12px; font-size: 1.02rem; font-weight: 600; margin-top: 8px; }
  .delete-btn:active { opacity: .6; }

  /* settings list */
  .set-group { background: var(--group); border-radius: 14px; overflow: hidden; margin-bottom: 20px; }
  .set-row { display: flex; align-items: center; gap: 12px; padding: 13px 15px; position: relative; font-size: 1.02rem; border: none; background: transparent; width: 100%; text-align: left; color: var(--label); }
  .set-row + .set-row::before { content: ""; position: absolute; left: 15px; right: 0; top: 0; height: .5px; background: var(--sep); }
  .set-row .ic { font-size: 1.1rem; width: 24px; text-align: center; }
  .set-row .val { margin-left: auto; color: var(--label2); font-size: .92rem; }
  .seg-ctl { display: inline-flex; background: var(--fill); border-radius: 9px; padding: 2px; margin-left: auto; }
  .seg-ctl button { border: none; background: transparent; color: var(--label); font-size: .82rem; font-weight: 600; padding: 5px 12px; border-radius: 7px; }
  .seg-ctl button.on { background: var(--elev); box-shadow: 0 1px 2px rgba(0,0,0,.15); }

  /* lightbox */
  .lightbox { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.92); display: none; align-items: center; justify-content: center; padding: 20px; }
  .lightbox.show { display: flex; }
  .lightbox img { max-width: 100%; max-height: 90vh; border-radius: 8px; }
  .lightbox .close { position: absolute; top: calc(16px + var(--safe-t)); right: 16px; width: 36px; height: 36px; border-radius: 50%; border: none; background: rgba(255,255,255,.2); color: #fff; font-size: 1.1rem; }

  /* toast */
  .toast { position: fixed; left: 50%; bottom: calc(100px + var(--safe-b)); transform: translateX(-50%) translateY(20px); background: rgba(30,30,30,.94); color: #fff; padding: 11px 18px; border-radius: 12px; font-size: .9rem; font-weight: 500; opacity: 0; pointer-events: none; transition: all .25s; z-index: 70; box-shadow: 0 6px 20px rgba(0,0,0,.3); max-width: 88%; text-align: center; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ---- Attachment viewer (imagens + PDF) ---- */
  .viewer { position: fixed; inset: 0; z-index: 60; background: #000; display: none; flex-direction: column; }
  .viewer.show { display: flex; }
  .viewer-bar {
    display: flex; align-items: center; gap: 10px; padding: calc(10px + var(--safe-t)) 14px 10px;
    background: rgba(20,20,22,.96); color: #fff; flex-shrink: 0;
  }
  .viewer-name { font-size: .9rem; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .viewer-actions { display: flex; gap: 4px; }
  .viewer-actions button { width: 36px; height: 36px; border-radius: 50%; border: none; background: rgba(255,255,255,.14); color: #fff; font-size: 1rem; }
  .viewer-actions button:active { background: rgba(255,255,255,.28); }
  .viewer-body { flex: 1; display: flex; align-items: center; justify-content: center; overflow: auto; padding: 10px; }
  .viewer-body img { max-width: 100%; max-height: 100%; border-radius: 8px; }
  .viewer-body iframe { width: 100%; height: 100%; border: none; background: #fff; border-radius: 6px; }
  .viewer-body .fallback { color: #fff; text-align: center; padding: 30px; }

  @media (min-width: 641px) { .sheet, .tabbar { border-radius: 14px 14px 0 0; } }
</style>
</head>
<body>
<div class="app">
  <div class="nav">
    <div class="nav-row">
      <h1>Agenda</h1>
      <div class="nav-actions">
        <button class="icon-round" id="addBtnTop" aria-label="Novo item" style="font-size:1.4rem;font-weight:300">+</button>
        <button class="icon-round" id="settingsBtn" aria-label="Ajustes">⚙️</button>
      </div>
    </div>
    <div class="nav-sub" id="navSub"></div>
    <div class="searchbar">
      <div class="sb" id="sbWrap">
        <span>🔍</span>
        <input type="text" id="search" placeholder="Buscar" autocomplete="off">
        <button class="clear" id="searchClear" aria-label="Limpar">✕</button>
      </div>
    </div>
    <div class="segs" id="segs">
      <button class="seg active" data-view="proximos">Próximos</button>
      <button class="seg" data-view="hoje">Hoje</button>
      <button class="seg" data-view="semana">Semana</button>
      <button class="seg" data-view="atrasados">Atrasados</button>
      <button class="seg" data-view="concluidos">Concluídos</button>
      <button class="seg" data-view="todos">Todos</button>
    </div>
  </div>

  <main id="viewList">
    <div class="syncbar" id="syncBar"></div>
    <div class="summary" id="summary"></div>
    <div id="list"></div>
  </main>

  <main id="viewCal" hidden>
    <div class="cal-head">
      <div class="m" id="calMonth"></div>
      <div class="cal-nav">
        <button class="icon-round" id="calPrev">‹</button>
        <button class="icon-round" id="calToday" style="width:auto;padding:0 12px;font-size:.85rem;font-weight:700;">Hoje</button>
        <button class="icon-round" id="calNext">›</button>
      </div>
    </div>
    <div class="cal-grid" id="calWeekdays"></div>
    <div class="cal-grid" id="calGrid"></div>
    <div class="cal-daylist" id="calDayList"></div>
  </main>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>

<script>
/* =====================================================================
   CONFIGURAÇÃO DA SINCRONIZAÇÃO (Firebase) — veja o README para trocar.
   ===================================================================== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyC769XJjDK9eOuTkJyhlvbN3CJs-u5vsJs",
  authDomain: "appagenda-45392.firebaseapp.com",
  projectId: "appagenda-45392",
  appId: "1:203208604332:web:d4768904eb11d9ce7ebd09"
};
/* ===================================================================== */

const STORAGE_KEY = 'agenda-escolar-v1';
const TYPES = [
  { key: 'dever',    label: 'Dever',    icon: '📝', color: 'var(--blue)' },
  { key: 'prova',    label: 'Prova',    icon: '📄', color: 'var(--red)' },
  { key: 'trabalho', label: 'Trabalho', icon: '📁', color: 'var(--orange)' },
  { key: 'evento',   label: 'Data',     icon: '📅', color: 'var(--green)' },
  { key: 'outro',    label: 'Outro',    icon: '📌', color: 'var(--gray)' }
];
const TYPE_MAP = Object.fromEntries(TYPES.map(t => [t.key, t]));

let items = load();
let currentView = 'proximos';
let currentTab = 'list';
let editingId = null;
let pendingAtts = [];          // metadados dos anexos no formulário
let attAddedThisSession = new Set();
let attToDelete = new Set();
let calCursor = new Date();    // mês visível no calendário
let calSelected = todayStr();

function load() { try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; } catch { return []; } }
function persistLocal() { localStorage.setItem(STORAGE_KEY, JSON.stringify(items)); }
function persist() { persistLocal(); pushRemote(); }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function haptic() { if (navigator.vibrate) navigator.vibrate(8); }

/* ---------- IndexedDB (arquivos) ---------- */
function openIDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('agenda-files', 1);
    r.onupgradeneeded = () => { if (!r.result.objectStoreNames.contains('files')) r.result.createObjectStore('files'); };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function idbPut(key, blob) { const db = await openIDB(); return new Promise((res, rej) => { const tx = db.transaction('files', 'readwrite'); tx.objectStore('files').put(blob, key); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); }
async function idbGet(key) { const db = await openIDB(); return new Promise((res, rej) => { const tx = db.transaction('files', 'readonly'); const q = tx.objectStore('files').get(key); q.onsuccess = () => res(q.result || null); q.onerror = () => rej(q.error); }); }
async function idbDel(key) { try { const db = await openIDB(); return new Promise((res) => { const tx = db.transaction('files', 'readwrite'); tx.objectStore('files').delete(key); tx.oncomplete = res; tx.onerror = res; }); } catch { } }

/* ---------- datas ---------- */
function todayStr() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function dateStrOf(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function daysDiff(dateStr) {
  const [y, m, d] = dateStr.split('-').map(Number);
  const [ty, tm, td] = todayStr().split('-').map(Number);
  return Math.round((new Date(y, m - 1, d) - new Date(ty, tm - 1, td)) / 86400000);
}
function formatDate(dateStr) {
  const [y, m, d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  const wd = dt.toLocaleDateString('pt-BR', { weekday: 'long' });
  const dm = dt.toLocaleDateString('pt-BR', { day: '2-digit', month: 'long' });
  return wd.charAt(0).toUpperCase() + wd.slice(1) + ', ' + dm + (y !== new Date().getFullYear() ? ' de ' + y : '');
}
function dueChip(it) {
  if (it.done) return '';
  const n = daysDiff(it.date);
  if (n < 0) return `<span class="chip due-late">Atrasado ${-n === 1 ? '1 dia' : (-n) + ' dias'}</span>`;
  if (n === 0) return '<span class="chip due-today">Hoje</span>';
  if (n === 1) return '<span class="chip due-soon">Amanhã</span>';
  if (n <= 7) return `<span class="chip due-soon">Em ${n} dias</span>`;
  return '';
}
function fmtBytes(b) { if (!b) return ''; if (b < 1024) return b + ' B'; if (b < 1048576) return (b / 1024).toFixed(0) + ' KB'; return (b / 1048576).toFixed(1) + ' MB'; }

/* ---------- filtro / views ---------- */
function visibleItems() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  let r = items.filter(it => {
    if (q && !(it.title.toLowerCase().includes(q) || (it.subject || '').toLowerCase().includes(q) || (it.notes || '').toLowerCase().includes(q))) return false;
    const n = daysDiff(it.date);
    switch (currentView) {
      case 'proximos': return !it.done && n >= 0;
      case 'hoje': return !it.done && n === 0;
      case 'semana': return !it.done && n >= 0 && n <= 7;
      case 'atrasados': return !it.done && n < 0;
      case 'concluidos': return it.done;
      case 'todos': return true;
    }
  });
  r.sort((a, b) => (a.date + (a.time || '99:99')).localeCompare(b.date + (b.time || '99:99')));
  if (currentView === 'concluidos') r.reverse();
  return r;
}

/* ---------- render ---------- */
function render() {
  renderNavSub();
  renderSummary();
  renderSegBadges();
  renderSyncBar();
  renderSubjectList();
  if (currentTab === 'list') renderList(); else renderCalendar();
}

function renderNavSub() {
  const d = new Date();
  const s = d.toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' });
  document.getElementById('navSub').textContent = s.charAt(0).toUpperCase() + s.slice(1);
}

function renderSummary() {
  const pend = items.filter(it => !it.done);
  const late = pend.filter(it => daysDiff(it.date) < 0).length;
  const today = pend.filter(it => daysDiff(it.date) === 0).length;
  const week = pend.filter(it => { const n = daysDiff(it.date); return n >= 0 && n <= 7; }).length;
  const provas = pend.filter(it => it.type === 'prova' && daysDiff(it.date) >= 0).length;
  const cards = [
    { n: late, l: 'Atrasados', c: 'red', v: 'atrasados' },
    { n: today, l: 'Hoje', c: 'orange', v: 'hoje' },
    { n: week, l: 'Próx. 7 dias', c: 'blue', v: 'semana' },
    { n: provas, l: 'Provas por vir', c: 'purple', v: 'proximos' }
  ];
  document.getElementById('summary').innerHTML = cards.map(c =>
    `<button class="sumcard ${c.c}" data-view="${c.v}"><div class="n">${c.n}</div><div class="l">${c.l}</div></button>`
  ).join('');
}

function renderSegBadges() {
  document.querySelectorAll('.seg').forEach(s => s.classList.toggle('active', s.dataset.view === currentView));
}

function renderSubjectList() {
  const subs = [...new Set(items.map(it => it.subject).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'pt-BR'));
  document.getElementById('subjectList').innerHTML = subs.map(s => `<option value="${esc(s)}">`).join('');
}

function attMini(it) {
  const n = (it.attachments || []).length;
  if (!n) return '';
  return `<span class="chip att">📎 ${n}</span>`;
}

function rowHtml(it) {
  const t = TYPE_MAP[it.type] || TYPE_MAP.outro;
  return `<div class="row ${it.done ? 'done' : ''}" data-id="${it.id}">
    <button class="circle" style="--c:${t.color}" data-toggle="${it.id}" aria-label="Concluir"></button>
    <div class="row-main" data-open="${it.id}">
      <div class="row-title">${esc(it.title)}</div>
      <div class="row-sub">
        <span class="chip type" style="background:${t.color}">${t.icon} ${t.label}</span>
        ${it.subject ? `<span class="chip">${esc(it.subject)}</span>` : ''}
        ${it.time ? `<span class="chip">🕐 ${it.time}</span>` : ''}
        ${dueChip(it)}${attMini(it)}
      </div>
    </div>
    <span class="chev" data-open="${it.id}">›</span>
  </div>`;
}

function groupByDate(list) {
  const g = new Map();
  for (const it of list) { if (!g.has(it.date)) g.set(it.date, []); g.get(it.date).push(it); }
  return g;
}

function renderList() {
  const list = document.getElementById('list');
  const vis = visibleItems();
  if (!vis.length) {
    const M = {
      proximos: ['🎉', 'Tudo em dia!', 'Toque em + para adicionar um item.'],
      hoje: ['😌', 'Nada para hoje', 'Aproveite para adiantar.'],
      semana: ['🗓️', 'Semana livre', 'Nada nos próximos 7 dias.'],
      atrasados: ['✅', 'Sem atrasos', 'Você está em dia.'],
      concluidos: ['📭', 'Nada concluído', 'Marque itens como feitos.'],
      todos: ['📚', 'Agenda vazia', 'Toque em + para começar.']
    }[currentView];
    list.innerHTML = `<div class="empty"><div class="big">${M[0]}</div><strong>${M[1]}</strong><p>${M[2]}</p></div>`;
    return;
  }
  let html = '';
  for (const [date, group] of groupByDate(vis)) {
    const n = daysDiff(date);
    let cls = '', prefix = '';
    if (n === 0) { cls = 'today'; prefix = 'Hoje · '; }
    else if (n === 1) prefix = 'Amanhã · ';
    else if (n < 0 && currentView !== 'concluidos' && currentView !== 'todos') cls = 'late';
    html += `<div class="day-sec"><div class="day-title ${cls}">${prefix}${formatDate(date)}</div><div class="group">${group.map(rowHtml).join('')}</div></div>`;
  }
  list.innerHTML = html;
}

/* ---------- calendário ---------- */
function renderCalendar() {
  const wd = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'];
  document.getElementById('calWeekdays').innerHTML = wd.map(d => `<div class="cal-wd">${d}</div>`).join('');
  const y = calCursor.getFullYear(), m = calCursor.getMonth();
  document.getElementById('calMonth').textContent = calCursor.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });

  const first = new Date(y, m, 1);
  const start = new Date(first); start.setDate(1 - first.getDay());
  const counts = new Map();
  for (const it of items) { const set = counts.get(it.date) || new Set(); set.add(it.type); counts.set(it.date, set); }

  let cells = '';
  for (let i = 0; i < 42; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i);
    const ds = dateStrOf(d);
    const other = d.getMonth() !== m;
    const isToday = ds === todayStr();
    const isSel = ds === calSelected;
    const types = counts.get(ds);
    let dots = '';
    if (types) {
      dots = '<div class="cal-dots">' + [...types].slice(0, 4).map(t => `<span class="cal-dot" style="background:${(TYPE_MAP[t] || TYPE_MAP.outro).color}"></span>`).join('') + '</div>';
    }
    cells += `<button class="cal-cell ${other ? 'other' : ''} ${isToday ? 'today' : ''} ${isSel ? 'sel' : ''}" data-date="${ds}">${d.getDate()}${dots}</button>`;
  }
  document.getElementById('calGrid').innerHTML = cells;

  const dayItems = items.filter(it => it.date === calSelected).sort((a, b) => (a.time || '99:99').localeCompare(b.time || '99:99'));
  const dl = document.getElementById('calDayList');
  if (!dayItems.length) {
    dl.innerHTML = `<div class="day-title">${formatDate(calSelected)}</div><div class="empty" style="padding:30px 20px"><p>Nada neste dia.</p></div>`;
  } else {
    dl.innerHTML = `<div class="day-title">${formatDate(calSelected)}</div><div class="group">${dayItems.map(rowHtml).join('')}</div>`;
  }
}

/* ---------- toggle / abrir ---------- */
function toggleDone(id) { const it = items.find(i => i.id === id); if (it) { it.done = !it.done; haptic(); persist(); render(); } }

/* ---------- sheet: item ---------- */
function openItemSheet(id) {
  editingId = id || null;
  attAddedThisSession = new Set();
  attToDelete = new Set();
  document.getElementById('itemTitle').textContent = id ? 'Editar' : 'Novo';
  document.getElementById('itemDelete').style.display = id ? 'block' : 'none';
  const it = id ? items.find(i => i.id === id) : null;
  document.getElementById('fTitle').value = it ? it.title : '';
  document.getElementById('fSubject').value = it ? (it.subject || '') : '';
  document.getElementById('fDate').value = it ? it.date : (currentTab === 'cal' ? calSelected : todayStr());
  document.getElementById('fTime').value = it ? (it.time || '') : '';
  document.getElementById('fNotes').value = it ? (it.notes || '') : '';
  selectedType = it ? it.type : 'dever';
  renderTypePick();
  pendingAtts = it ? (it.attachments || []).map(a => ({ ...a })) : [];
  renderAtts();
  validateSave();
  showSheet('itemSheet', 'itemBackdrop');
}

let selectedType = 'dever';
function renderTypePick() {
  document.getElementById('fTypePick').innerHTML = TYPES.map(t =>
    `<button class="type-opt ${t.key === selectedType ? 'sel' : ''}" style="${t.key === selectedType ? 'background:' + t.color : ''}" data-type="${t.key}">${t.icon} ${t.label}</button>`
  ).join('');
}

function renderAtts() {
  const grid = document.getElementById('attGrid');
  let html = `<button class="att-add" id="attAddBtn"><span class="plus">+</span>Adicionar</button>`;
  html += pendingAtts.map((a, i) => {
    const isImg = (a.type || '').startsWith('image/');
    return `<button class="att-item" data-att-view="${i}">
      ${isImg ? `<img data-thumb="${a.id}" alt="${esc(a.name)}">` : `<div class="pdf"><span class="ic">📄</span><span class="nm">${esc(a.name)}</span></div>`}
      <span class="rm" data-att-rm="${i}">✕</span>
    </button>`;
  }).join('');
  grid.innerHTML = html;
  // carrega miniaturas das imagens
  pendingAtts.forEach(a => {
    if ((a.type || '').startsWith('image/')) {
      const img = grid.querySelector(`[data-thumb="${a.id}"]`);
      if (img) idbGet(a.id).then(blob => { if (blob) img.src = URL.createObjectURL(blob); else img.closest('.att-item').classList.add('missing'); });
    }
  });
}

async function handleFiles(fileList) {
  const files = [...fileList];
  for (const f of files) {
    const okType = f.type.startsWith('image/') || f.type === 'application/pdf';
    if (!okType) { toast('Só PDF e imagens são aceitos.'); continue; }
    if (f.size > 25 * 1024 * 1024) { toast(`"${f.name}" é muito grande (máx. 25 MB).`); continue; }
    const aid = uid();
    await idbPut(aid, f);
    attAddedThisSession.add(aid);
    pendingAtts.push({ id: aid, name: f.name, type: f.type, size: f.size });
  }
  renderAtts();
}

function removeAtt(i) {
  const a = pendingAtts[i]; if (!a) return;
  if (attAddedThisSession.has(a.id)) { idbDel(a.id); attAddedThisSession.delete(a.id); }
  else attToDelete.add(a.id);
  pendingAtts.splice(i, 1);
  renderAtts();
}

async function viewAtt(i) {
  const a = pendingAtts[i]; if (!a) return;
  const blob = await idbGet(a.id);
  if (!blob) { toast('Arquivo salvo em outro aparelho.'); return; }
  openViewer(URL.createObjectURL(blob), a.type || '', a.name || 'arquivo');
}

function validateSave() {
  const ok = document.getElementById('fTitle').value.trim() && document.getElementById('fDate').value;
  document.getElementById('itemSave').disabled = !ok;
}

function saveItem() {
  const data = {
    title: document.getElementById('fTitle').value.trim(),
    type: selectedType,
    subject: document.getElementById('fSubject').value.trim(),
    date: document.getElementById('fDate').value,
    time: document.getElementById('fTime').value,
    notes: document.getElementById('fNotes').value.trim(),
    attachments: pendingAtts.map(a => ({ id: a.id, name: a.name, type: a.type, size: a.size }))
  };
  if (!data.title || !data.date) return;
  attToDelete.forEach(id => idbDel(id));
  if (editingId) { const it = items.find(i => i.id === editingId); if (it) Object.assign(it, data); }
  else items.push({ id: uid(), done: false, createdAt: new Date().toISOString(), ...data });
  attAddedThisSession = new Set(); attToDelete = new Set();
  persist(); closeSheet('itemSheet', 'itemBackdrop'); render();
}

function cancelItem() {
  attAddedThisSession.forEach(id => idbDel(id));   // descarta anexos não salvos
  attAddedThisSession = new Set(); attToDelete = new Set();
  closeSheet('itemSheet', 'itemBackdrop');
}

function deleteItem() {
  const it = items.find(i => i.id === editingId); if (!it) return;
  if (!confirm(`Excluir "${it.title}"?`)) return;
  (it.attachments || []).forEach(a => idbDel(a.id));
  items = items.filter(i => i.id !== editingId);
  persist(); closeSheet('itemSheet', 'itemBackdrop'); render();
}

/* ---------- sheet infra + drag ---------- */
function showSheet(sheetId, backId) {
  document.getElementById(backId).classList.add('show');
  const s = document.getElementById(sheetId);
  s.style.transform = ''; requestAnimationFrame(() => s.classList.add('open'));
}
function closeSheet(sheetId, backId) {
  document.getElementById(sheetId).classList.remove('open');
  document.getElementById(backId).classList.remove('show');
}
function enableDrag(grabberId, sheetId, backId, onClose) {
  const grab = document.getElementById(grabberId), sheet = document.getElementById(sheetId);
  let sy = 0, dy = 0, dragging = false;
  const down = e => { dragging = true; sy = (e.touches ? e.touches[0].clientY : e.clientY); sheet.style.transition = 'none'; };
  const move = e => { if (!dragging) return; dy = Math.max(0, (e.touches ? e.touches[0].clientY : e.clientY) - sy); sheet.style.transform = `translateY(${dy}px)`; };
  const up = () => { if (!dragging) return; dragging = false; sheet.style.transition = ''; if (dy > 110) { onClose(); } else sheet.style.transform = ''; dy = 0; };
  grab.addEventListener('touchstart', down, { passive: true }); grab.addEventListener('touchmove', move, { passive: true }); grab.addEventListener('touchend', up);
  grab.addEventListener('mousedown', e => { down(e); const mm = ev => move(ev), mu = () => { up(); document.removeEventListener('mousemove', mm); document.removeEventListener('mouseup', mu); }; document.addEventListener('mousemove', mm); document.addEventListener('mouseup', mu); });
}

/* ---------- visualizador de anexos / toast ---------- */
let viewerUrl = null;
function openViewer(url, type, name) {
  viewerUrl = url;
  document.getElementById('viewerName').textContent = name;
  const body = document.getElementById('viewerBody');
  if (type.startsWith('image/')) body.innerHTML = `<img src="${url}" alt="${esc(name)}">`;
  else if (type === 'application/pdf') body.innerHTML = `<iframe src="${url}" title="${esc(name)}"></iframe>`;
  else body.innerHTML = `<div class="fallback">Prévia não disponível.<br>Use ⬇ para baixar.</div>`;
  document.getElementById('viewer').classList.add('show');
}
function closeViewer() {
  document.getElementById('viewer').classList.remove('show');
  document.getElementById('viewerBody').innerHTML = '';
  if (viewerUrl) { URL.revokeObjectURL(viewerUrl); viewerUrl = null; }
}
let toastTimer = null;
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2600); }

/* ---------- tema ---------- */
function applyTheme(mode) {
  const root = document.documentElement;
  if (mode === 'auto') root.removeAttribute('data-theme'); else root.setAttribute('data-theme', mode);
  try { localStorage.setItem('agenda-theme', mode); } catch { }
  document.querySelectorAll('#themeCtl button').forEach(b => b.classList.toggle('on', b.dataset.theme === mode));
}

/* ---------- backup ---------- */
function exportData() {
  const blob = new Blob([JSON.stringify(items, null, 2)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'agenda-' + todayStr() + '.json'; a.click(); URL.revokeObjectURL(a.href);
}
function importData(ev) {
  const file = ev.target.files[0]; if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const data = JSON.parse(r.result);
      if (!Array.isArray(data)) throw 0;
      if (confirm(`Importar ${data.length} itens? Isso substitui a agenda atual.`)) {
        items = data.filter(it => it && it.title && it.date).map(it => ({
          id: it.id || uid(), title: String(it.title), type: TYPE_MAP[it.type] ? it.type : 'outro',
          subject: it.subject || '', date: it.date, time: it.time || '', notes: it.notes || '',
          done: !!it.done, attachments: Array.isArray(it.attachments) ? it.attachments : [], createdAt: it.createdAt || new Date().toISOString()
        }));
        persist(); render(); toast('Agenda importada.');
      }
    } catch { toast('Arquivo inválido.'); }
    ev.target.value = '';
  };
  r.readAsText(file);
}

/* ---------- Firebase sync ---------- */
const fb = { app: null, auth: null, db: null, user: null };
let syncState = 'off', syncMsg = '', unsub = null, pushTimer = null;
function firebaseConfigured() { return FIREBASE_CONFIG && FIREBASE_CONFIG.apiKey && !FIREBASE_CONFIG.apiKey.startsWith('COLE_'); }
function setSyncState(s, msg) { syncState = s; syncMsg = msg || ''; renderSyncBar(); }
function initFirebase() {
  renderSyncBar();
  if (!firebaseConfigured()) return;
  if (!window.firebase || !firebase.initializeApp) { setSyncState('error', 'Sem conexão'); return; }
  try { fb.app = firebase.initializeApp(FIREBASE_CONFIG); fb.auth = firebase.auth(); fb.db = firebase.firestore(); }
  catch (e) { setSyncState('error', 'Config inválida'); return; }
  fb.auth.getRedirectResult().catch(() => {});
  fb.auth.onAuthStateChanged(u => { fb.user = u; if (u) startSync(); else stopSync(); renderSyncBar(); });
}
function signIn() {
  if (!fb.auth) return;
  const p = new firebase.auth.GoogleAuthProvider();
  fb.auth.signInWithPopup(p).catch(err => {
    if (err.code === 'auth/popup-closed-by-user' || err.code === 'auth/cancelled-popup-request') return;
    if (err.code === 'auth/popup-blocked' || err.code === 'auth/operation-not-supported-in-this-environment') fb.auth.signInWithRedirect(p);
    else setSyncState('error', err.message);
  });
}
function signOutUser() { if (fb.auth) fb.auth.signOut(); }
function mergeById(primary, extra) { const ids = new Set(primary.map(i => i.id)); const r = primary.slice(); for (const it of extra) if (!ids.has(it.id)) r.push(it); return r; }
async function startSync() {
  if (!fb.db || !fb.user) return;
  setSyncState('connecting');
  const ref = fb.db.collection('agendas').doc(fb.user.uid);
  try {
    const snap = await ref.get();
    const remote = snap.exists ? (snap.data().items || []) : [];
    const merged = mergeById(remote, items);
    if (JSON.stringify(merged) !== JSON.stringify(remote)) await ref.set({ items: merged, updatedAt: Date.now() });
    items = merged; persistLocal(); render();
  } catch (e) { setSyncState('error', e.message); return; }
  if (unsub) unsub();
  unsub = ref.onSnapshot(snap => { if (!snap.exists) return; items = snap.data().items || []; persistLocal(); render(); setSyncState('on'); }, err => setSyncState('error', err.message));
  setSyncState('on');
}
function stopSync() { if (unsub) { unsub(); unsub = null; } setSyncState('off'); }
function pushRemote() {
  if (!fb.db || !fb.user) return;
  clearTimeout(pushTimer); setSyncState('connecting');
  pushTimer = setTimeout(() => { fb.db.collection('agendas').doc(fb.user.uid).set({ items, updatedAt: Date.now() }).then(() => setSyncState('on')).catch(err => setSyncState('error', err.message)); }, 400);
}

const GG = '<svg class="g-ic" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.9 2.4 30.3 0 24 0 14.6 0 6.4 5.4 2.4 13.3l7.9 6.1C12.2 13.6 17.6 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.4c-.5 2.9-2.1 5.3-4.6 7l7.1 5.5c4.2-3.9 6.6-9.6 6.6-16.5z"/><path fill="#FBBC05" d="M10.3 28.6c-.5-1.4-.7-2.9-.7-4.6s.3-3.2.7-4.6l-7.9-6.1C.9 16.5 0 20.1 0 24s.9 7.5 2.4 10.7l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.1-5.5c-2 1.3-4.5 2.1-8.8 2.1-6.4 0-11.8-4.1-13.7-9.9l-7.9 6.1C6.4 42.6 14.6 48 24 48z"/></svg>';
function renderSyncBar() {
  const bar = document.getElementById('syncBar');
  const set = document.getElementById('setSync');
  let inner;
  if (!firebaseConfigured()) {
    inner = `<span class="sdot off"></span><span>Sincronização não configurada</span><span class="spacer"></span>`;
  } else if (syncState === 'error') {
    inner = `<span class="sdot err"></span><span>Erro de sincronização</span><span class="spacer"></span>` +
      (fb.user ? `<button class="mini-btn ghost" onclick="signOutUser()">Sair</button>` : `<button class="mini-btn" onclick="signIn()">${GG} Entrar</button>`);
  } else if (fb.user) {
    const label = fb.user.displayName || fb.user.email || 'conta Google';
    const txt = syncState === 'connecting' ? 'Sincronizando…' : 'Sincronizado';
    const dot = syncState === 'connecting' ? 'wait' : 'on';
    inner = `<span class="sdot ${dot}"></span><span>${txt} · ${esc(label)}</span><span class="spacer"></span><button class="mini-btn ghost" onclick="signOutUser()">Sair</button>`;
  } else {
    inner = `<span class="sdot off"></span><span>Sincronize entre aparelhos</span><span class="spacer"></span><button class="mini-btn" onclick="signIn()">${GG} Entrar com Google</button>`;
  }
  if (bar) bar.innerHTML = inner;
  if (set) set.innerHTML = `<div style="display:flex;align-items:center;gap:10px;width:100%">${inner}</div>`;
}

/* ---------- eventos ---------- */
document.getElementById('segs').addEventListener('click', e => { const s = e.target.closest('.seg'); if (!s) return; currentView = s.dataset.view; render(); document.getElementById('list').scrollIntoView({ block: 'nearest' }); });
document.getElementById('summary').addEventListener('click', e => { const c = e.target.closest('.sumcard'); if (!c) return; currentView = c.dataset.view; switchTab('list'); render(); });
document.getElementById('search').addEventListener('input', () => { document.getElementById('sbWrap').classList.toggle('has-text', !!document.getElementById('search').value); render(); });
document.getElementById('searchClear').addEventListener('click', () => { const i = document.getElementById('search'); i.value = ''; document.getElementById('sbWrap').classList.remove('has-text'); render(); });

// delegação para linhas (lista e calendário)
document.body.addEventListener('click', e => {
  const tog = e.target.closest('[data-toggle]'); if (tog) { toggleDone(tog.dataset.toggle); return; }
  const op = e.target.closest('[data-open]'); if (op) { openItemSheet(op.dataset.open); return; }
});

// abas
function switchTab(tab) {
  currentTab = tab;
  document.getElementById('viewList').hidden = tab !== 'list';
  document.getElementById('viewCal').hidden = tab !== 'cal';
  const listOnly = tab === 'list';
  document.querySelector('.searchbar').style.display = listOnly ? '' : 'none';
  document.getElementById('segs').style.display = listOnly ? '' : 'none';
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  render();
}
document.querySelectorAll('.tab-btn').forEach(b => b.addEventListener('click', () => switchTab(b.dataset.tab)));

// calendário nav
document.getElementById('calPrev').addEventListener('click', () => { calCursor = new Date(calCursor.getFullYear(), calCursor.getMonth() - 1, 1); renderCalendar(); });
document.getElementById('calNext').addEventListener('click', () => { calCursor = new Date(calCursor.getFullYear(), calCursor.getMonth() + 1, 1); renderCalendar(); });
document.getElementById('calToday').addEventListener('click', () => { calCursor = new Date(); calSelected = todayStr(); renderCalendar(); });
document.getElementById('calGrid').addEventListener('click', e => { const c = e.target.closest('.cal-cell'); if (!c) return; calSelected = c.dataset.date; haptic(); renderCalendar(); });

// add + item sheet
document.getElementById('addBtnTop').addEventListener('click', () => openItemSheet(null));
document.getElementById('itemCancel').addEventListener('click', cancelItem);
document.getElementById('itemBackdrop').addEventListener('click', cancelItem);
document.getElementById('itemSave').addEventListener('click', saveItem);
document.getElementById('itemDelete').addEventListener('click', deleteItem);
document.getElementById('fTitle').addEventListener('input', validateSave);
document.getElementById('fDate').addEventListener('input', validateSave);
document.getElementById('fTypePick').addEventListener('click', e => { const b = e.target.closest('.type-opt'); if (!b) return; selectedType = b.dataset.type; renderTypePick(); });
document.getElementById('attGrid').addEventListener('click', e => {
  if (e.target.closest('#attAddBtn')) { document.getElementById('fFiles').click(); return; }
  const rm = e.target.closest('[data-att-rm]'); if (rm) { e.stopPropagation(); removeAtt(+rm.dataset.attRm); return; }
  const v = e.target.closest('[data-att-view]'); if (v) { viewAtt(+v.dataset.attView); }
});
document.getElementById('fFiles').addEventListener('change', e => { handleFiles(e.target.files); e.target.value = ''; });
enableDrag('itemGrabber', 'itemSheet', 'itemBackdrop', cancelItem);

// settings sheet
document.getElementById('settingsBtn').addEventListener('click', () => {
  renderSyncBar();
  showSheet('setSheet', 'setBackdrop');
});
document.getElementById('setDone').addEventListener('click', () => closeSheet('setSheet', 'setBackdrop'));
document.getElementById('setBackdrop').addEventListener('click', () => closeSheet('setSheet', 'setBackdrop'));
document.getElementById('themeCtl').addEventListener('click', e => { const b = e.target.closest('button'); if (b) applyTheme(b.dataset.theme); });
document.getElementById('btnExport').addEventListener('click', exportData);
document.getElementById('btnImport').addEventListener('click', () => document.getElementById('importFile').click());
document.getElementById('importFile').addEventListener('change', importData);
enableDrag('setGrabber', 'setSheet', 'setBackdrop', () => closeSheet('setSheet', 'setBackdrop'));

// visualizador de anexos
document.getElementById('viewerClose').addEventListener('click', closeViewer);
document.getElementById('viewerOpen').addEventListener('click', () => { if (viewerUrl) window.open(viewerUrl, '_blank'); });
document.getElementById('viewerDownload').addEventListener('click', () => {
  if (!viewerUrl) return;
  const a = document.createElement('a'); a.href = viewerUrl;
  a.download = document.getElementById('viewerName').textContent || 'arquivo';
  document.body.appendChild(a); a.click(); a.remove();
});

document.addEventListener('keydown', e => { if (e.key === 'Escape') { cancelItem(); closeSheet('setSheet', 'setBackdrop'); closeViewer(); } });

/* ---------- init ---------- */
let savedTheme = 'auto'; try { savedTheme = localStorage.getItem('agenda-theme') || 'auto'; } catch { }
applyTheme(savedTheme);
render();
initFirebase();
</script>
