<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minha Agenda Escolar</title>
<style>
  :root {
    --bg: #f4f6fb;
    --card: #ffffff;
    --text: #1c2333;
    --muted: #6b7280;
    --border: #e3e7f0;
    --primary: #4f6df5;
    --primary-soft: #e8ecfe;
    --danger: #e5484d;
    --danger-soft: #fdeaea;
    --warn: #d97706;
    --warn-soft: #fef3e2;
    --ok: #16a34a;
    --ok-soft: #e6f6ec;
    --shadow: 0 2px 10px rgba(28, 35, 51, 0.07);
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151f;
      --card: #1b1f2e;
      --text: #e8eaf2;
      --muted: #9aa1b5;
      --border: #2a3045;
      --primary: #7288f7;
      --primary-soft: #232c4e;
      --danger: #f2555a;
      --danger-soft: #3a2226;
      --warn: #f0a13a;
      --warn-soft: #3a2f1c;
      --ok: #3ecf6f;
      --ok-soft: #1c3327;
      --shadow: 0 2px 10px rgba(0, 0, 0, 0.35);
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  .container { max-width: 900px; margin: 0 auto; padding: 24px 16px 80px; }

  header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-bottom: 20px; }
  header h1 { font-size: 1.5rem; display: flex; align-items: center; gap: 10px; }
  .header-actions { display: flex; gap: 8px; }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .stat {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px 16px; box-shadow: var(--shadow);
  }
  .stat .num { font-size: 1.6rem; font-weight: 700; }
  .stat .label { font-size: 0.8rem; color: var(--muted); margin-top: 2px; }
  .stat.alert .num { color: var(--danger); }
  .stat.warn .num { color: var(--warn); }
  .stat.ok .num { color: var(--ok); }

  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; align-items: center; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; }
  .tab {
    border: 1px solid var(--border); background: var(--card); color: var(--muted);
    padding: 7px 14px; border-radius: 999px; cursor: pointer; font-size: 0.85rem; font-weight: 500;
    transition: all .15s;
  }
  .tab:hover { border-color: var(--primary); color: var(--primary); }
  .tab.active { background: var(--primary); border-color: var(--primary); color: #fff; }

  .search { flex: 1; min-width: 180px; }
  input, select, textarea, button {
    font-family: inherit; font-size: 0.95rem; color: var(--text);
  }
  input[type="text"], input[type="date"], input[type="time"], select, textarea {
    width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px;
    background: var(--card); outline: none; transition: border-color .15s;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--primary); }

  .btn {
    display: inline-flex; align-items: center; gap: 6px; padding: 10px 16px;
    border: none; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 0.9rem;
    transition: opacity .15s, transform .05s;
  }
  .btn:active { transform: scale(0.98); }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
  .btn-ghost:hover { color: var(--primary); border-color: var(--primary); }
  .btn:hover { opacity: 0.9; }

  .list { display: flex; flex-direction: column; gap: 10px; }
  .day-group { margin-top: 10px; }
  .day-header { font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 8px 2px 8px; }
  .day-header.today { color: var(--primary); }
  .day-header.late { color: var(--danger); }

  .item {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px 16px; box-shadow: var(--shadow); display: flex; gap: 12px; align-items: flex-start;
    transition: opacity .2s;
  }
  .item.done { opacity: 0.55; }
  .item.done .item-title { text-decoration: line-through; }
  .item-check {
    flex-shrink: 0; width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--border);
    background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center;
    color: transparent; font-size: 13px; margin-top: 2px; transition: all .15s;
  }
  .item-check:hover { border-color: var(--ok); }
  .item.done .item-check { background: var(--ok); border-color: var(--ok); color: #fff; }
  .item-body { flex: 1; min-width: 0; }
  .item-title { font-weight: 600; font-size: 1rem; word-wrap: break-word; }
  .item-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; align-items: center; }
  .item-notes { margin-top: 6px; font-size: 0.85rem; color: var(--muted); white-space: pre-wrap; word-wrap: break-word; }
  .item-actions { display: flex; gap: 4px; flex-shrink: 0; }
  .icon-btn {
    background: transparent; border: none; cursor: pointer; padding: 6px; border-radius: 8px;
    color: var(--muted); font-size: 0.95rem; line-height: 1;
  }
  .icon-btn:hover { background: var(--primary-soft); color: var(--primary); }
  .icon-btn.del:hover { background: var(--danger-soft); color: var(--danger); }

  .badge {
    display: inline-flex; align-items: center; gap: 4px; font-size: 0.72rem; font-weight: 600;
    padding: 3px 9px; border-radius: 999px;
  }
  .badge.type-dever   { background: var(--primary-soft); color: var(--primary); }
  .badge.type-prova   { background: var(--danger-soft); color: var(--danger); }
  .badge.type-trabalho{ background: var(--warn-soft); color: var(--warn); }
  .badge.type-evento  { background: var(--ok-soft); color: var(--ok); }
  .badge.type-outro   { background: var(--border); color: var(--muted); }
  .badge.subject { background: var(--bg); color: var(--muted); border: 1px solid var(--border); }
  .badge.time { background: transparent; color: var(--muted); padding-left: 0; }
  .badge.due-late  { background: var(--danger-soft); color: var(--danger); }
  .badge.due-today { background: var(--warn-soft); color: var(--warn); }
  .badge.due-soon  { background: var(--primary-soft); color: var(--primary); }

  .empty {
    text-align: center; padding: 48px 16px; color: var(--muted);
    background: var(--card); border: 1px dashed var(--border); border-radius: var(--radius);
  }
  .empty .big { font-size: 2.4rem; margin-bottom: 8px; }

  /* Modal */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(10, 14, 25, 0.55); display: none;
    align-items: flex-start; justify-content: center; padding: 24px 16px; z-index: 50; overflow-y: auto;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--card); border-radius: var(--radius); padding: 24px; width: 100%; max-width: 480px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.25); margin-top: 4vh;
  }
  .modal h2 { font-size: 1.15rem; margin-bottom: 16px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 0.8rem; font-weight: 600; color: var(--muted); margin-bottom: 5px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }

  .fab {
    position: fixed; bottom: 24px; right: 24px; width: 56px; height: 56px; border-radius: 50%;
    background: var(--primary); color: #fff; border: none; font-size: 1.7rem; cursor: pointer;
    box-shadow: 0 6px 18px rgba(79, 109, 245, 0.45); display: flex; align-items: center; justify-content: center;
    z-index: 40;
  }
  .fab:hover { opacity: 0.92; }

  @media (max-width: 560px) {
    .row2 { grid-template-columns: 1fr; }
    header h1 { font-size: 1.25rem; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>📚 Minha Agenda Escolar</h1>
    <div class="header-actions">
      <button class="btn btn-ghost" onclick="exportData()" title="Baixar backup em JSON">⬇ Exportar</button>
      <button class="btn btn-ghost" onclick="document.getElementById('importFile').click()" title="Restaurar backup JSON">⬆ Importar</button>
      <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
    </div>
  </header>

  <div class="stats" id="stats"></div>

  <div class="toolbar">
    <div class="tabs" id="tabs">
      <button class="tab active" data-view="proximos">Próximos</button>
      <button class="tab" data-view="hoje">Hoje</button>
      <button class="tab" data-view="semana">Esta semana</button>
      <button class="tab" data-view="atrasados">Atrasados</button>
      <button class="tab" data-view="concluidos">Concluídos</button>
      <button class="tab" data-view="todos">Todos</button>
    </div>
  </div>

  <div class="toolbar">
    <input type="text" class="search" id="search" placeholder="🔍 Buscar por título, matéria ou anotação...">
    <select id="filterType" style="width:auto">
      <option value="">Todos os tipos</option>
      <option value="dever">📝 Dever de casa</option>
      <option value="prova">📄 Prova</option>
      <option value="trabalho">📁 Trabalho</option>
      <option value="evento">📅 Data importante</option>
      <option value="outro">📌 Outro</option>
    </select>
    <select id="filterSubject" style="width:auto">
      <option value="">Todas as matérias</option>
    </select>
  </div>

  <div class="list" id="list"></div>
</div>

<button class="fab" onclick="openModal()" title="Adicionar item">+</button>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h2 id="modalTitle">Novo item</h2>
    <form id="itemForm" onsubmit="saveItem(event)">
      <div class="field">
        <label for="fTitle">Título *</label>
        <input type="text" id="fTitle" required placeholder="Ex.: Exercícios cap. 5, Prova de matemática...">
      </div>
      <div class="row2">
        <div class="field">
          <label for="fType">Tipo</label>
          <select id="fType">
            <option value="dever">📝 Dever de casa</option>
            <option value="prova">📄 Prova</option>
            <option value="trabalho">📁 Trabalho</option>
            <option value="evento">📅 Data importante</option>
            <option value="outro">📌 Outro</option>
          </select>
        </div>
        <div class="field">
          <label for="fSubject">Matéria</label>
          <input type="text" id="fSubject" list="subjectList" placeholder="Ex.: Matemática">
          <datalist id="subjectList"></datalist>
        </div>
      </div>
      <div class="row2">
        <div class="field">
          <label for="fDate">Data *</label>
          <input type="date" id="fDate" required>
        </div>
        <div class="field">
          <label for="fTime">Hora (opcional)</label>
          <input type="time" id="fTime">
        </div>
      </div>
      <div class="field">
        <label for="fNotes">Anotações (opcional)</label>
        <textarea id="fNotes" rows="3" placeholder="Detalhes, páginas, conteúdo da prova..."></textarea>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
        <button type="submit" class="btn btn-primary" id="saveBtn">Salvar</button>
      </div>
    </form>
  </div>
</div>

<script>
const STORAGE_KEY = 'agenda-escolar-v1';
const TYPE_LABELS = {
  dever: '📝 Dever de casa',
  prova: '📄 Prova',
  trabalho: '📁 Trabalho',
  evento: '📅 Data importante',
  outro: '📌 Outro'
};

let items = load();
let currentView = 'proximos';
let editingId = null;

function load() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
  catch { return []; }
}
function persist() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
}
function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

/* ---- datas ---- */
function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function daysDiff(dateStr) {
  const [y, m, d] = dateStr.split('-').map(Number);
  const [ty, tm, td] = todayStr().split('-').map(Number);
  const a = new Date(y, m - 1, d);
  const b = new Date(ty, tm - 1, td);
  return Math.round((a - b) / 86400000);
}
function formatDate(dateStr) {
  const [y, m, d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  const weekday = dt.toLocaleDateString('pt-BR', { weekday: 'long' });
  const date = dt.toLocaleDateString('pt-BR', { day: '2-digit', month: 'long' });
  return weekday.charAt(0).toUpperCase() + weekday.slice(1) + ', ' + date + (y !== new Date().getFullYear() ? ' de ' + y : '');
}
function dueBadge(item) {
  if (item.done) return '';
  const diff = daysDiff(item.date);
  if (diff < 0) return `<span class="badge due-late">⚠ Atrasado ${-diff === 1 ? 'há 1 dia' : 'há ' + (-diff) + ' dias'}</span>`;
  if (diff === 0) return '<span class="badge due-today">🔥 É hoje!</span>';
  if (diff === 1) return '<span class="badge due-soon">Amanhã</span>';
  if (diff <= 7) return `<span class="badge due-soon">Em ${diff} dias</span>`;
  return '';
}

/* ---- filtros e views ---- */
function visibleItems() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  const type = document.getElementById('filterType').value;
  const subject = document.getElementById('filterSubject').value;

  let result = items.filter(it => {
    if (type && it.type !== type) return false;
    if (subject && it.subject !== subject) return false;
    if (q && !(it.title.toLowerCase().includes(q) ||
               (it.subject || '').toLowerCase().includes(q) ||
               (it.notes || '').toLowerCase().includes(q))) return false;
    const diff = daysDiff(it.date);
    switch (currentView) {
      case 'proximos':   return !it.done && diff >= 0;
      case 'hoje':       return !it.done && diff === 0;
      case 'semana':     return !it.done && diff >= 0 && diff <= 7;
      case 'atrasados':  return !it.done && diff < 0;
      case 'concluidos': return it.done;
      case 'todos':      return true;
    }
  });

  result.sort((a, b) => (a.date + (a.time || '99:99')).localeCompare(b.date + (b.time || '99:99')));
  if (currentView === 'concluidos') result.reverse();
  return result;
}

/* ---- render ---- */
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function render() {
  renderStats();
  renderSubjectFilters();
  const list = document.getElementById('list');
  const vis = visibleItems();

  if (!vis.length) {
    const messages = {
      proximos: ['🎉', 'Nada pendente por aqui!', 'Toque no + para adicionar um dever, prova ou data importante.'],
      hoje: ['😌', 'Nada para hoje!', 'Aproveite para adiantar os próximos itens.'],
      semana: ['🗓️', 'Semana livre!', 'Nenhum item nos próximos 7 dias.'],
      atrasados: ['✅', 'Nenhum atraso!', 'Você está em dia com tudo.'],
      concluidos: ['📭', 'Nada concluído ainda', 'Marque itens como feitos e eles aparecerão aqui.'],
      todos: ['📚', 'Sua agenda está vazia', 'Toque no + para adicionar o primeiro item.']
    };
    const [icon, title, sub] = messages[currentView];
    list.innerHTML = `<div class="empty"><div class="big">${icon}</div><strong>${title}</strong><p style="margin-top:6px;font-size:0.9rem">${sub}</p></div>`;
    return;
  }

  // agrupa por data
  const groups = new Map();
  for (const it of vis) {
    if (!groups.has(it.date)) groups.set(it.date, []);
    groups.get(it.date).push(it);
  }

  let html = '';
  for (const [date, group] of groups) {
    const diff = daysDiff(date);
    let cls = '', prefix = '';
    if (diff === 0) { cls = 'today'; prefix = 'Hoje — '; }
    else if (diff === 1) { prefix = 'Amanhã — '; }
    else if (diff < 0 && currentView !== 'concluidos' && currentView !== 'todos') { cls = 'late'; }
    html += `<div class="day-group"><div class="day-header ${cls}">${prefix}${formatDate(date)}</div>`;
    for (const it of group) html += itemHtml(it);
    html += '</div>';
  }
  list.innerHTML = html;
}

function itemHtml(it) {
  return `
  <div class="item ${it.done ? 'done' : ''}">
    <button class="item-check" onclick="toggleDone('${it.id}')" title="${it.done ? 'Desmarcar' : 'Marcar como concluído'}">✓</button>
    <div class="item-body">
      <div class="item-title">${esc(it.title)}</div>
      <div class="item-meta">
        <span class="badge type-${it.type}">${TYPE_LABELS[it.type] || it.type}</span>
        ${it.subject ? `<span class="badge subject">${esc(it.subject)}</span>` : ''}
        ${it.time ? `<span class="badge time">🕐 ${it.time}</span>` : ''}
        ${dueBadge(it)}
      </div>
      ${it.notes ? `<div class="item-notes">${esc(it.notes)}</div>` : ''}
    </div>
    <div class="item-actions">
      <button class="icon-btn" onclick="openModal('${it.id}')" title="Editar">✏️</button>
      <button class="icon-btn del" onclick="deleteItem('${it.id}')" title="Excluir">🗑️</button>
    </div>
  </div>`;
}

function renderStats() {
  const pend = items.filter(it => !it.done);
  const late = pend.filter(it => daysDiff(it.date) < 0).length;
  const today = pend.filter(it => daysDiff(it.date) === 0).length;
  const week = pend.filter(it => { const d = daysDiff(it.date); return d >= 0 && d <= 7; }).length;
  const provas = pend.filter(it => it.type === 'prova' && daysDiff(it.date) >= 0).length;
  document.getElementById('stats').innerHTML = `
    <div class="stat ${late ? 'alert' : 'ok'}"><div class="num">${late}</div><div class="label">Atrasados</div></div>
    <div class="stat ${today ? 'warn' : ''}"><div class="num">${today}</div><div class="label">Para hoje</div></div>
    <div class="stat"><div class="num">${week}</div><div class="label">Nos próximos 7 dias</div></div>
    <div class="stat"><div class="num">${provas}</div><div class="label">Provas por vir</div></div>`;
}

function renderSubjectFilters() {
  const subjects = [...new Set(items.map(it => it.subject).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'pt-BR'));
  const sel = document.getElementById('filterSubject');
  const current = sel.value;
  sel.innerHTML = '<option value="">Todas as matérias</option>' +
    subjects.map(s => `<option value="${esc(s)}">${esc(s)}</option>`).join('');
  if (subjects.includes(current)) sel.value = current;
  document.getElementById('subjectList').innerHTML = subjects.map(s => `<option value="${esc(s)}">`).join('');
}

/* ---- ações ---- */
function toggleDone(id) {
  const it = items.find(i => i.id === id);
  if (it) { it.done = !it.done; persist(); render(); }
}

function deleteItem(id) {
  const it = items.find(i => i.id === id);
  if (it && confirm(`Excluir "${it.title}"?`)) {
    items = items.filter(i => i.id !== id);
    persist(); render();
  }
}

function openModal(id) {
  editingId = id || null;
  document.getElementById('modalTitle').textContent = id ? 'Editar item' : 'Novo item';
  const form = document.getElementById('itemForm');
  form.reset();
  if (id) {
    const it = items.find(i => i.id === id);
    if (!it) return;
    document.getElementById('fTitle').value = it.title;
    document.getElementById('fType').value = it.type;
    document.getElementById('fSubject').value = it.subject || '';
    document.getElementById('fDate').value = it.date;
    document.getElementById('fTime').value = it.time || '';
    document.getElementById('fNotes').value = it.notes || '';
  } else {
    document.getElementById('fDate').value = todayStr();
  }
  document.getElementById('modalOverlay').classList.add('open');
  document.getElementById('fTitle').focus();
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
  editingId = null;
}

function saveItem(ev) {
  ev.preventDefault();
  const data = {
    title: document.getElementById('fTitle').value.trim(),
    type: document.getElementById('fType').value,
    subject: document.getElementById('fSubject').value.trim(),
    date: document.getElementById('fDate').value,
    time: document.getElementById('fTime').value,
    notes: document.getElementById('fNotes').value.trim()
  };
  if (!data.title || !data.date) return;

  if (editingId) {
    const it = items.find(i => i.id === editingId);
    if (it) Object.assign(it, data);
  } else {
    items.push({ id: uid(), done: false, createdAt: new Date().toISOString(), ...data });
  }
  persist();
  closeModal();
  render();
}

/* ---- backup ---- */
function exportData() {
  const blob = new Blob([JSON.stringify(items, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'agenda-escolar-' + todayStr() + '.json';
  a.click();
  URL.revokeObjectURL(a.href);
}

function importData(ev) {
  const file = ev.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      if (!Array.isArray(data)) throw new Error();
      if (confirm(`Importar ${data.length} itens? Isso substituirá sua agenda atual.`)) {
        items = data.filter(it => it && it.title && it.date).map(it => ({
          id: it.id || uid(),
          title: String(it.title),
          type: TYPE_LABELS[it.type] ? it.type : 'outro',
          subject: it.subject || '',
          date: it.date,
          time: it.time || '',
          notes: it.notes || '',
          done: !!it.done,
          createdAt: it.createdAt || new Date().toISOString()
        }));
        persist(); render();
      }
    } catch {
      alert('Arquivo inválido. Selecione um backup JSON exportado por este app.');
    }
    ev.target.value = '';
  };
  reader.readAsText(file);
}

/* ---- eventos ---- */
document.getElementById('tabs').addEventListener('click', ev => {
  const tab = ev.target.closest('.tab');
  if (!tab) return;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  tab.classList.add('active');
  currentView = tab.dataset.view;
  render();
});
document.getElementById('search').addEventListener('input', render);
document.getElementById('filterType').addEventListener('change', render);
document.getElementById('filterSubject').addEventListener('change', render);
document.getElementById('modalOverlay').addEventListener('click', ev => {
  if (ev.target === ev.currentTarget) closeModal();
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape') closeModal();
});

render();
</script>
</body>
</html>
